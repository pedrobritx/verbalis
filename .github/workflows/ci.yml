name: CI

# Guardrail for every revamp phase (docs/revamp/ROADMAP.md §4 Phase 0.1):
# typecheck + unit tests + build + Playwright e2e must be green on every PR.
# Deployment stays in deploy.yml and is untouched by this workflow.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm generate-icons
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      # Regression guard for the cloud path (ROADMAP §3.1): build once with the
      # env flags set so a break in the signed-in code fails CI even though the
      # local-only build above never loads it. Dummy values — never contacted.
      - name: Build with cloud env configured
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://dummy.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-anon-key
          VITE_AUTH_PROVIDERS: google,azure,apple
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
