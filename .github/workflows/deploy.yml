name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_path:
        description: >-
          Base path to build for (e.g. "/verbalis/" for a path-based deploy).
          Leave blank to deploy at the domain root (default, used for the
          verbalis.britx.me subdomain).
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm generate-icons
      - run: pnpm build
        env:
          BASE_PATH: ${{ github.event.inputs.base_path || '/' }}
          # Optional cloud config (docs/cloud.md). Set these as repository
          # Variables (Settings -> Secrets and variables -> Actions -> Variables)
          # to enable the signed-in mode in production. Both are public by design
          # (the anon key ships in the bundle and is gated by RLS). Leaving them
          # unset builds the 100%-local app exactly as before.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_AUTH_PROVIDERS: ${{ vars.VITE_AUTH_PROVIDERS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
