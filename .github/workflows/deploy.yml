name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_path:
        description: >-
          Base path to build for (e.g. "/verbalis/" for a path-based deploy).
          Leave blank to deploy at the domain root (default, used for the
          verbalis.britx.me subdomain).
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm generate-icons
      - run: pnpm build
        env:
          BASE_PATH: ${{ github.event.inputs.base_path || '/' }}
          # Cloud config for the signed-in mode (docs/cloud.md). These map your
          # repository Secrets/Variables to the VITE_-prefixed vars Vite exposes
          # to the client build. All are public by design (the anon key ships in
          # the bundle and is gated by RLS), so a repository Variable is the more
          # natural home, but the fallback chain also accepts a Secret and the
          # unprefixed SUPABASE_URL name. Unset everywhere -> the build stays
          # 100% local, exactly as before.
          #
          # SECURITY: the Supabase *secret* key (sb_secret_...) is deliberately
          # NOT referenced here and must NEVER be exposed to the build or given a
          # VITE_ prefix — it would leak into the public bundle. It is unused by
          # this client-side app; keep it only for future server-side workflows.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AUTH_PROVIDERS: ${{ vars.VITE_AUTH_PROVIDERS || secrets.VITE_AUTH_PROVIDERS }}
          # Google Drive connector (Phase 6.3) — pure client OAuth, independent of
          # Supabase. Public by design (a Web OAuth client id is not a secret; it is
          # gated by the console's authorised-origins allow-list). Unset -> the
          # Drive buttons stay hidden.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
          # OneDrive connector (Phase 6.4) — pure client OAuth via MSAL, independent
          # of Supabase. An Azure AD Web/SPA client id is public by design (gated by
          # the app registration's redirect-URI allow-list). Unset -> hidden.
          VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID || secrets.VITE_MS_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
