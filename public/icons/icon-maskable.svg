    <path d="M362 156 L268 352" stroke="#6df0e7" stroke-opacity="0.62" stroke-width="56" stroke-linecap="round"/>
    <path d="M150 156 L244 352" stroke="url(#vbArmM)" stroke-width="56" stroke-linecap="round"/>
    <circle cx="256" cy="372" r="20" fill="#00c2cc"/>
  </g>
</svg>
