<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Verbalis">
  <defs>
    <linearGradient id="vbTileM" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c2126"/>
      <stop offset="1" stop-color="#0b0d0e"/>
    </linearGradient>
    <linearGradient id="vbArmM" x1="150" y1="150" x2="362" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19e3d4"/>
      <stop offset="1" stop-color="#00b3bd"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for OS masking -->
  <rect x="0" y="0" width="512" height="512" fill="url(#vbTileM)"/>

  <!-- Mark scaled into the central safe zone (~78%) -->
