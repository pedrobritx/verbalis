<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Verbalis">
  <defs>
    <linearGradient id="vbTile" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c2126"/>
      <stop offset="1" stop-color="#0b0d0e"/>
    </linearGradient>
    <linearGradient id="vbArm" x1="150" y1="150" x2="362" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19e3d4"/>
      <stop offset="1" stop-color="#00b3bd"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#vbTile)"/>
  <rect x="8.5" y="8.5" width="495" height="495" rx="115.5" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Two offset strokes forming a V: two voices converging into one -->
  <!-- Right arm (second voice) sits behind, lighter and offset -->
  <path d="M362 156 L268 352" stroke="#6df0e7" stroke-opacity="0.62" stroke-width="56" stroke-linecap="round"/>
  <!-- Left arm (first voice), bold accent -->
  <path d="M150 156 L244 352" stroke="url(#vbArm)" stroke-width="56" stroke-linecap="round"/>

  <!-- Convergence point: the two voices meet -->
  <circle cx="256" cy="372" r="20" fill="#00c2cc"/>
</svg>
